schema: model_pack/v1
repo: Drake_Models
package: drake_models
engine: drake
engine_version: ">=1.20"
anthropometrics: winter_2009
format: sdformat-1.8
axis_convention: z_up
models_root: src/drake_models/exercises
exercises:
  - id: squat
    path: src/drake_models/exercises/squat
  - id: deadlift
    path: src/drake_models/exercises/deadlift
  - id: bench_press
    path: src/drake_models/exercises/bench_press
  - id: snatch
    path: src/drake_models/exercises/snatch
  - id: clean_and_jerk
    path: src/drake_models/exercises/clean_and_jerk
  - id: gait
    path: src/drake_models/exercises/gait
  - id: sit_to_stand
    path: src/drake_models/exercises/sit_to_stand
capabilities:
  load_in_engine:
    { level: full, evidence: tests/parity/test_engine_conformance.py }
  forward_kinematics: { level: none, evidence: null } # no public FK API
  inverse_kinematics: {
      level: partial,
      evidence: src/drake_models/optimization/inverse_kinematics.py,
    } # solver defines no end-effector targets
  forward_dynamics: {
      level: full,
      evidence: tests/parity/test_tracking_simulation.py,
    } # TrackingSimulator rollout (#369)
  inverse_dynamics:
    { level: full, evidence: tests/parity/test_inverse_dynamics.py }
  contact_grf: { level: full, evidence: tests/parity/test_ground_reaction.py } # contact_results.measure_ground_reaction: per-foot + total GRF and CoP
  urdf_import: { level: none, evidence: null }
  urdf_export: { level: none, evidence: null }
  video_export: { level: none, evidence: null }
