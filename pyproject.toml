[project]
name = "drake-models"
version = "0.1.0"
description = "Drake multibody models for classical barbell exercises"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["drake", "pydrake", "biomechanics", "simulation", "barbell", "strength-training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.26.4,<3.0.0",
    "matplotlib>=3.10.8",
    "defusedxml>=0.7.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
drake = [
    "drake",
]
dev = [
    "pytest>=9.0.3",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "mypy>=1.15.0",
    "types-PyYAML",
    "types-requests",
    "hypothesis>=6.151.12",
    "bandit>=1.7.7",
]

[project.urls]
Homepage = "https://github.com/D-sorganization/Drake_Models"
Repository = "https://github.com/D-sorganization/Drake_Models"

[project.scripts]
drake-models = "drake_models.__main__:main"

[project.entry-points."biomech.model_pack"]
drake_models = "drake_models.model_pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drake_models"]

[tool.hatch.build.targets.wheel.force-include]
"model_pack.yaml" = "drake_models/model_pack.yaml"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "T201", "SIM",
    "C4", "PIE", "PLE", "FURB", "RSE", "LOG",
    "PERF", "RET", "C90",
]
ignore = [
    "E501",
    "RET504",
    "PERF203",
    "PERF401",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]
"tests/**" = ["T201"]
"examples/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
timeout = 60
timeout_method = "thread"

# Default lane: fast, deterministic, offline.
# Heavy paths are deselected; nightly/release lanes opt in via -m overrides.
addopts = """
  -ra
  -q
  --strict-markers
  --strict-config
  --durations=20
  -m "not slow and not live_simulation and not e2e and not requires_network"
"""

markers = [
    # ---- tier markers ----
    "unit: pure logic, fully mocked, < 100 ms wall-clock",
    "integration: cross-module / file-system / process boundaries, < 5 s",
    "e2e: full-stack smoke tests; nightly + release gate only",
    "slow: > 1 s wall-clock; deselect with -m 'not slow'",
    "live_simulation: requires a real physics / math engine; deselect by default",

    # ---- environment markers ----
    "requires_network: needs real outbound network; deselect by default",
    "requires_gpu: needs CUDA / Metal / ROCm",
    "requires_gl: needs OpenGL or a display",
    "headless_safe: verified under QT_QPA_PLATFORM=offscreen",

    # ---- per-engine markers ----
    "requires_drake: tests requiring pydrake package",
    "requires_mujoco: skip when import mujoco fails",
    "requires_pinocchio: skip when pinocchio is the stub PyPI wheel",
    "requires_opensim: skip when import opensim fails",
    "requires_matlab: skip when MATLAB Engine for Python is unavailable",

    # ---- workflow markers ----
    "serial: must run with -n 0 (xdist parallel breaks this test)",
    "benchmark: marks performance benchmarks; not a primary correctness gate",
    "smoke: release-blocking smoke; subset of e2e",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
    "if TYPE_CHECKING:",
]
