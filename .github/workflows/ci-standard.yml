name: CI Standard
on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dispatcher: route to self-hosted if available
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
  quality-gate:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          cache: "pip"
          python-version: "3.11"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - run: pip install -e .
      - run: pip install ruff>=0.14.0 bandit>=1.7.7 pytest>=9.0.3 pytest-cov>=7.1.0
      - run: pip install --ignore-installed mypy>=1.15.0 types-PyYAML

      - name: Lint
        run: ruff check src scripts tests examples benchmarks

      - name: Check Formatting (ruff)
        run: ruff format --check src scripts tests examples benchmarks

      - run: mypy src --config-file pyproject.toml

      - name: Verify No Placeholders
        run: |
          violations=$(
            find . \( -path "./.git" -o -path "./.mypy_cache" -o -path "./.ruff_cache" -o -path "./__pycache__" -o -path "./scripts" \) -prune -o -type f -name "*.py" -print0 \
              | xargs -0 grep -nE "TODO|FIXME" || true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
            exit 1
          fi

      - name: Security Audit
        timeout-minutes: 5
        shell: bash
        run: |
          python -m venv .audit-venv
          if [ -d .audit-venv/Scripts ]; then
            source .audit-venv/Scripts/activate
          else
            source .audit-venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit
          pip-audit --skip-editable --ignore-vuln CVE-2026-3219

      - name: Bandit Security Scan
        run: bandit -r src/ -ll -ii --format txt

  tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Test Suite
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pytest \
            -p no:xvfb \
            -p no:pytest_xvfb \
            --timeout=60 \
            --timeout-method=thread \
            -m "not slow and not requires_drake and not benchmark" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml \
            --cov-fail-under=80 \
            --tb=short \
            -v

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Run local-only workflow guard
        run: python scripts/check_local_only_workflows.py
