name: CI Standard
on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dispatcher: route to hosted runners on public repos.
  # This repo is public, so standard GitHub-hosted runners are free and
  # unmetered. Pinning the dispatcher itself to the fleet meant every
  # downstream job waited for a self-hosted slot before it could even learn
  # where to run. Private repos still fall through to the fleet, so no Actions
  # minutes are ever billed.
  #
  # Reverting: set the repo variable CI_RUNNER_MODE=local.
  pick-runner:
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' ||
      'd-sorg-fleet' }}
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.check.outputs.runner }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Select runner target without API polling
        id: check
        shell: bash
        env:
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RUNNER_LABEL: d-sorg-fleet
        run: |
          mode="${CI_RUNNER_MODE:-auto}"
          if [ "$REPOSITORY_PRIVATE" != "true" ] && [ "$mode" != "local" ]; then
            mode="hosted"
            runner="ubuntu-latest"
          else
            mode="local"
            runner="$RUNNER_LABEL"
          fi
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          {
            echo "runner=$runner"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Runner Selection"
            echo "- requested mode: \`${CI_RUNNER_MODE:-unset}\`"
            echo "- selected target: \`$runner\` (\`$mode\`)"
            echo "- GitHub API calls: \`0\`"
          } >> "$GITHUB_STEP_SUMMARY"
  quality-gate:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          cache: "pip"
          python-version: "3.11"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - run: pip install -e .
      - run: pip install ruff>=0.14.0 bandit>=1.7.7 pytest>=9.0.3 pytest-cov>=7.1.0
      - run: pip install --ignore-installed mypy>=1.15.0 types-PyYAML

      - name: Lint
        run: ruff check src scripts tests examples benchmarks

      - name: Check Formatting (ruff)
        run: ruff format --check src scripts tests examples benchmarks

      - run: mypy src --config-file pyproject.toml

      - name: Verify No Placeholders
        run: |
          violations=$(
            find . \( -path "./.git" -o -path "./.mypy_cache" -o -path "./.ruff_cache" -o -path "./__pycache__" -o -path "./scripts" \) -prune -o -type f -name "*.py" -print0 \
              | xargs -0 grep -nE "TODO|FIXME" || true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
            exit 1
          fi

      - name: Security Audit
        timeout-minutes: 5
        shell: bash
        run: |
          python -m venv .audit-venv
          if [ -d .audit-venv/Scripts ]; then
            source .audit-venv/Scripts/activate
          else
            source .audit-venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip install pip-audit
          pip-audit --skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3447

      - name: Bandit Security Scan
        run: bandit -r src/ -ll -ii --format txt

  tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Test Suite
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pytest \
            -p no:xvfb \
            -p no:pytest_xvfb \
            --timeout=60 \
            --timeout-method=thread \
            -m "not slow and not requires_drake and not benchmark" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml \
            --cov-fail-under=80 \
            --tb=short \
            -v

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Run local-only workflow guard
        run: python scripts/check_local_only_workflows.py
