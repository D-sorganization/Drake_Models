name: CI Standard
on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dispatcher: route to self-hosted if available
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
  lint:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          cache: "pip"
          python-version: "3.12"
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          ruff check src scripts tests examples benchmarks

      - name: Check Formatting (ruff)
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          ruff format --check src scripts tests examples benchmarks

      - name: Type Check (mypy)
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          mypy src --config-file pyproject.toml

      - name: Verify No Placeholders
        run: |
          violations=$(
            find . \( -path "./.git" -o -path "./.mypy_cache" -o -path "./.ruff_cache" -o -path "./__pycache__" -o -path "./scripts" -o -path "./.venv*" -o -path "./.audit-venv*" \) -prune -o -type f -name "*.py" -print0 \
              | xargs -0 grep -nE "TODO|FIXME" || true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
            exit 1
          fi

      - name: Security Audit
        timeout-minutes: 10
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade "setuptools>=83.0.0" pip-audit
          pip-audit --skip-editable --ignore-vuln CVE-2026-3219 --ignore-vuln PYSEC-2026-3447

      - name: Bandit Security Scan
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          bandit -r src/ -ll -ii --format txt

  tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pip install --upgrade pip
          python -m pip install wheel setuptools
          python -m pip install -e ".[dev]"

      - name: Run Test Suite
        shell: bash
        run: |
          if [ -d .venv/Scripts ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          python -m pytest \
            -p no:xvfb \
            -p no:pytest_xvfb \
            --timeout=60 \
            --timeout-method=thread \
            -m "not slow and not requires_drake and not benchmark" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml \
            --cov-fail-under=80 \
            --tb=short \
            -v

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7
      - name: Run local-only workflow guard
        run: python3 scripts/check_local_only_workflows.py

  # Required branch-protection context for `main` (org ruleset
  # Repository_Protections requires exactly this name). It aggregates lint AND
  # the test suite so a red test run blocks merge - before the 2026-09-15 fleet
  # audit only lint was gated here and failing tests merged freely.
  #
  # `if: always()` is load-bearing: without it an upstream failure *skips* this
  # job, and GitHub treats a skipped required check as passing.
  quality-gate:
    needs: [pick-runner, lint, tests]
    if: always()
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Require every gated job to succeed
        shell: bash
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TESTS: ${{ needs.tests.result }}
          SKIPPED_OK: "-"
        run: |
          failed=0
          for pair in "lint=$RESULT_LINT" "tests=$RESULT_TESTS"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            echo "$job: $result"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [[ " $SKIPPED_OK " == *" $job "* ]]; then
              echo "::notice::$job was skipped by its own condition; allowed."
              continue
            fi
            echo "::error::$job reported '$result', expected 'success'."
            failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::quality-gate: one or more gated jobs did not succeed."
            exit 1
          fi
          echo "quality-gate: all gated jobs succeeded."
