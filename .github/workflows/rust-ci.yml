name: Rust CI
on:
  push:
    branches: [main]
    paths:
      - "rust_core/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "rust_core/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
  rust-check:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    # Per-workspace toolchain homes: persistent self-hosted runners share
    # ~/.rustup and ~/.cargo, and a concurrent job's install deletes binaries
    # from under this one (RM#2021).
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap rustup into the workspace homes
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            rust_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_core/Cargo.lock') }}
      - name: Check Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
